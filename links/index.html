<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FORM · קישורים</title>
<meta name="description" content="FORM · דף נחיתה, אפליקציה, ספר מערכת, טיזר וסרטון שימוש">
<meta name="theme-color" content="#F2F1EE">
<link rel="icon" href="../icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Arimo:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--paper:#F2F1EE;--ink:#1C1A18;--muted:#6B655E;--line:#D6D2C9;--orange:#FA4416;--font:"Helvetica Hebrew",Arimo,"Helvetica Neue",Helvetica,Arial,sans-serif}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--font);-webkit-font-smoothing:antialiased}
svg{display:block}
main{max-width:720px;margin:0 auto;padding:clamp(40px,9vw,88px) 24px 40px}
header{display:grid;gap:18px;margin-bottom:clamp(36px,7vw,64px)}
.kick{color:var(--orange);font-weight:700;font-size:15px;letter-spacing:.01em}
.logo{width:clamp(180px,42vw,300px);direction:ltr}
.sub{font-size:clamp(26px,5vw,36px);font-weight:700;line-height:1.1;margin:4px 0 0}
.by{color:var(--muted);font-size:15px;line-height:1.6}
ol{list-style:none;margin:0;padding:0;border-top:1.5px solid var(--ink)}
li a{display:grid;grid-template-columns:clamp(64px,13vw,92px) minmax(0,1fr) auto;gap:clamp(16px,3.5vw,28px);align-items:center;padding:clamp(18px,3.6vw,26px) 0;border-bottom:1.5px solid var(--line);text-decoration:none;color:inherit}
.sh{aspect-ratio:1;width:100%;display:flex;align-items:center;justify-content:center;transition:transform .35s cubic-bezier(.3,1.6,.5,1)}
.sh svg{width:100%;height:100%}
.tx{display:grid;gap:6px;min-width:0}
.tt{display:flex;align-items:flex-end;gap:8px 12px;flex-wrap:wrap}
.tt .n svg{height:clamp(22px,4vw,28px);width:auto}
.tt b{font-size:clamp(21px,4.2vw,28px);line-height:1}
.tx p{margin:0;color:var(--muted);font-size:clamp(14.5px,2.8vw,16.5px);line-height:1.45}
.tx code{font:12.5px/1.3 ui-monospace,Menlo,monospace;color:var(--ink);opacity:.45;direction:ltr;text-align:right;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.go{width:44px;height:44px;border-radius:50%;box-shadow:inset 0 0 0 1.5px var(--ink);display:flex;align-items:center;justify-content:center;transition:background .2s,color .2s}
.go svg{width:18px;height:18px}
li a:hover .sh{transform:rotate(-6deg) scale(1.06)}
li a:hover .go{background:var(--ink);color:var(--paper)}
.tag{display:inline-block;white-space:nowrap;font-size:11.5px;font-weight:700;color:var(--paper);background:var(--ink);border-radius:10px;padding:3px 8px;margin-inline-start:2px;transform:translateY(-3px)}
footer{margin-top:clamp(48px,9vw,80px);display:grid;gap:22px}
.strip{display:flex;gap:10px;direction:ltr;flex-wrap:nowrap;overflow:hidden}
.strip svg{width:34px;height:34px;flex:none}
.fn{display:flex;justify-content:space-between;gap:16px;color:var(--muted);font-size:13.5px;flex-wrap:wrap}
@media (max-width:480px){.go{width:36px;height:36px}.go svg{width:15px;height:15px}}
</style>
</head>
<body>
<main>
<header>
 <span class="kick">הגשה · תרגיל 01</span>
 <span class="logo" id="logo"></span>
 <p class="sub">תני צורה ליום שלך</p>
 <span class="by">יומן בהשראת ברברה סטאופכר סולומון<br>עדן זיגדון · HIT</span>
</header>
<ol id="list"></ol>
<footer><div class="strip" id="strip"></div><div class="fn"><span>כל הקישורים פתוחים, בלי התחברות</span><span>FORM · 2026</span></div></footer>
</main>

document.getElementById('list').innerHTML=ITEMS.map(([sh,c,t,d,u,tag],i)=>`<li><a href="${u}" target="_blank" rel="noopener"><span class="sh">${svg(S[sh]||SHAPES[i],c)}</span><span class="tx"><span class="tt"><span class="n">${num(i+1)}</span><b>${t}</b>${tag?`<span class="tag">${tag}</span>`:''}</span><p>${d}</p><code>${u.replace('https://','')}</code></span><span class="go">${AR}</span></a></li>`).join('');
const PAL=['#FA4416','#F00202','#D8319A','#5E0160','#3E27B3','#0270B6','#188C5B','#EBB61D','#1C1A18'];
document.getElementById('strip').innerHTML=SHAPES.slice(0,24).map((s,i)=>svg(s,PAL[(i*4)%PAL.length])).join('');
</script>
