<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>FORM</title>
<meta name="description" content="FORM · תני צורה ליום שלך">
<meta name="theme-color" content="#F2F1EE">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="FORM">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Arimo:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--paper:#F2F1EE;--ink:#1C1A18;--muted:#5B5650;--gray:#A8A59C;--line:#CFCBC2;--orange:#FA4416;--hdr:150px;
 --st:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px);
 --font:"Helvetica Hebrew",Arimo,"Helvetica Neue",Helvetica,Arial,sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--paper);color:var(--ink);font-family:var(--font);overscroll-behavior:none}
body{overflow:hidden;touch-action:pan-y;-webkit-user-select:none;user-select:none}
button,input{font-family:var(--font)}
button{font-size:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
#app{position:fixed;inset:0;max-width:520px;margin:0 auto;background:var(--paper)}
header{position:absolute;top:0;left:0;right:0;height:calc(var(--hdr) + var(--st));padding:calc(var(--st) + 40px) 24px 0;display:flex;justify-content:space-between;align-items:flex-start;background:var(--paper);z-index:5}
#num{height:52px;display:flex;justify-content:flex-start}
#num svg{height:52px;width:auto;display:block}
#line{margin:10px 0 0;font-size:14px;color:var(--orange)}
#plus{width:44px;height:44px;margin-top:6px;position:relative;flex:none}
#plus i{position:absolute;display:block;background:var(--orange);border-radius:5px}
#plus i:first-child{left:2px;right:2px;top:17px;height:10px}
#plus i:last-child{top:2px;bottom:2px;left:17px;width:10px}
#plus:active{transform:scale(.88)}
#stage{position:absolute;top:calc(var(--hdr) + var(--st));left:0;right:0;bottom:0;overflow:hidden}
.view{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;padding:4px 18px calc(70vh + var(--sb));transform-origin:50% 30%;will-change:transform,opacity}
.view::-webkit-scrollbar{display:none}
.sec{margin:0 0 22px}
.sec h3{margin:0 0 10px;font-size:13px;font-weight:400;color:var(--muted)}
.grid{display:grid;direction:rtl}
.g3{grid-template-columns:repeat(3,1fr);gap:0}.g6{grid-template-columns:repeat(6,1fr);gap:0}.g9{grid-template-columns:repeat(9,1fr);gap:0}
.tile{aspect-ratio:1;display:block;width:100%}
.tile svg,.big svg,.pick svg,.prev svg,.edprev svg{width:100%;height:100%;display:block;overflow:hidden}
.tile:active{transform:scale(.94)}
.addtile{aspect-ratio:1;border:2px dashed var(--line);display:flex;align-items:center;justify-content:center}
.addtile i{width:22px;height:22px;position:relative;display:block}.addtile i::before,.addtile i::after{content:'';position:absolute;background:var(--line);border-radius:3px}
.addtile i::before{left:0;right:0;top:8px;height:6px}.addtile i::after{top:0;bottom:0;left:8px;width:6px}
.view.task{padding:0 !important;scroll-snap-type:y mandatory}
.page{height:100%;scroll-snap-align:start;scroll-snap-stop:always;display:flex;flex-direction:column;padding:14px 24px 30px}
.cap{text-align:right;width:100%}
.cap h2{margin:0;font-size:20px;font-weight:700;line-height:1.25}
.cap p{margin:6px 0 0;font-size:14px;color:var(--muted)}
.big{flex:1;display:flex;align-items:center;justify-content:center;min-height:0;width:100%}
.big>div{width:min(100%,48vh,420px);aspect-ratio:1}
.empty{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:0 30px 60px}
.empty .dash{width:150px;height:150px;border:2px dashed var(--gray);margin-bottom:30px}
.empty b{font-size:21px;font-weight:700}.empty span{font-size:15px;font-weight:400;color:var(--muted);margin-top:10px}
#ov{position:fixed;inset:0;z-index:20;display:none;background:var(--paper)}
#ov.on{display:block;animation:fadein .25s ease}
@keyframes fadein{from{opacity:0}to{opacity:1}}
.ovin{position:absolute;inset:0;max-width:520px;margin:0 auto;display:flex;flex-direction:column;padding:calc(var(--st) + 14px) 18px calc(var(--sb) + 18px);--cell:calc((min(100vw,520px) - 36px)/5)}
.ovtop{display:flex;justify-content:space-between;align-items:center;height:44px}
.x{width:40px;height:40px;position:relative}
.x::before,.x::after{content:'';position:absolute;left:7px;right:7px;top:17.5px;height:5px;border-radius:3px;background:var(--ink);transform:rotate(45deg)}.x::after{transform:rotate(-45deg)}
.prog{display:flex;gap:6px;direction:rtl}.prog i{width:24px;height:5px;border-radius:3px;background:var(--line);display:block;transition:background .3s}
.prog i.done{background:var(--ink)}.prog i.cur{background:var(--orange)}
.back{font-size:15px;color:var(--muted);min-width:40px;text-align:left}
.step{flex:1;display:flex;flex-direction:column;align-items:center;min-height:0;animation:stepin .35s cubic-bezier(.2,.8,.2,1)}
@keyframes stepin{from{opacity:0;transform:translateY(18px) scale(.98)}to{opacity:1;transform:none}}
.step h2{margin:30px 0 4px;font-size:22px;font-weight:700;text-align:center}
.step .hint{font-size:14px;color:var(--muted);min-height:18px;text-align:center}
.tin{margin-top:auto;margin-bottom:auto;width:100%;border:0;border-bottom:2px solid var(--ink);background:transparent;font-size:24px;font-weight:700;text-align:center;padding:10px 4px;color:var(--ink);outline:none;caret-color:var(--orange);border-radius:0;-webkit-user-select:text;user-select:text}
.tin::placeholder{color:var(--line);font-weight:400}
.picks{margin-top:20px;width:100%;flex:1;overflow-y:auto;display:grid;grid-template-columns:repeat(5,1fr);gap:14px;padding:6px 6px 20px;align-content:start}
.pick{aspect-ratio:1;padding:4px;border-radius:12px;outline:3px solid transparent;outline-offset:2px;transition:outline-color .15s,transform .15s}
.pick.sel{outline-color:var(--orange)}.pick:active{transform:scale(.92)}
.prev{width:min(62vw,240px);aspect-ratio:1;margin:auto 0 34px}
.prev svg{animation:pop .35s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{from{transform:scale(.85)}to{transform:none}}
.pal{display:flex;flex-wrap:wrap;max-width:300px;justify-content:center;gap:16px;margin-bottom:auto;direction:rtl}
.pal button{width:38px;height:38px;border-radius:50%;outline:2.5px solid transparent;outline-offset:4px}
.pal button.sel{outline-color:var(--ink)}
.chips{display:flex;gap:10px;margin-top:36px;direction:rtl;flex-wrap:wrap;justify-content:center}
.chip{height:40px;padding:0 18px;border:1.5px solid var(--ink);border-radius:20px;font-size:16px}
.chip.on{background:var(--ink);color:var(--paper)}
.din{margin-top:16px;font-size:18px;border:0;border-bottom:2px solid var(--ink);background:transparent;padding:6px;text-align:center;color:var(--ink)}
.tbox{margin-top:auto;position:relative;width:250px;height:76px;border-top:2px solid var(--ink);border-bottom:2px solid var(--ink);display:flex;align-items:center;justify-content:center}
.tbox.off{opacity:.25}
.tbox .tnum svg{height:44px;width:auto;display:block}
.tbox input{position:absolute;inset:0;opacity:0;width:100%;height:100%;font-size:16px}
.notime{margin:16px 0 auto;font-size:14px;color:var(--muted);display:flex;align-items:center;gap:8px}
.notime i{width:20px;height:20px;border:2px solid var(--ink);display:inline-block;border-radius:4px}
.notime.on i{background:var(--orange);border-color:var(--orange)}
.opts{margin:auto 0;display:flex;flex-direction:column;gap:12px;width:100%;align-items:center}
.opt{width:min(100%,300px);height:56px;border-radius:28px;border:1.5px solid var(--ink);font-size:16px;font-weight:700}
.opt.on{background:var(--ink);color:var(--paper)}
.cta{align-self:center;width:230px;height:56px;border-radius:28px;background:var(--ink);color:var(--paper);font-size:16px;font-weight:700;margin-top:18px;transition:opacity .2s,transform .1s}
.cta.or{background:var(--orange)}.cta:disabled{opacity:.25}.cta:active{transform:scale(.97)}
.erow{display:flex;gap:8px;margin-top:20px;direction:rtl;justify-content:center}
.erow .chip{height:34px;font-size:14px;padding:0 14px}
.edprev{width:min(46vw,190px);aspect-ratio:1;margin:auto 0 10px}
.del{margin-top:12px;align-self:center;color:#F00202;font-weight:700;font-size:15px;padding:8px}
/* add flow on the shared 5-column grid */
.step{justify-content:flex-start}
.og{display:grid;grid-template-columns:repeat(5,1fr);direction:rtl;width:100%;align-content:start}
.og>.c{aspect-ratio:1;display:block;padding:0;border:0;border-radius:0}
.og .c svg{width:100%;height:100%;display:block}
.og .w5{grid-column:1/-1;aspect-ratio:auto;height:var(--cell)}
.og .w2{grid-column:span 2;aspect-ratio:auto;height:var(--cell)}
.og .w1{aspect-ratio:1}
.og .blk{grid-column:2/span 3;grid-row:span 3;aspect-ratio:1;padding:0}
.og .blk svg{width:100%;height:100%;display:block}
.og .t{display:flex;align-items:center;justify-content:center;background:#E6E3DD;color:var(--ink);font-size:16px;font-weight:700;transition:background .2s,color .2s,opacity .2s}
.og .t.on{background:var(--ink);color:var(--paper)}
.og .t.off{opacity:.25}
.og.has .pick:not(.sel),.og.has .gcol:not(.sel){opacity:.2}
.og .pick,.og .gcol{transition:opacity .25s,transform .15s}.og .pick:active,.og .gcol:active{transform:scale(.94)}
.scroll{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;-webkit-mask-image:linear-gradient(to bottom,#000 calc(100% - 46px),transparent);mask-image:linear-gradient(to bottom,#000 calc(100% - 46px),transparent);padding-bottom:30px}
.gcta{width:100%;height:var(--cell);background:var(--ink);color:var(--paper);font-size:18px;font-weight:700;border-radius:0;flex:none;transition:opacity .2s}
.gcta.or{background:var(--orange)}.gcta:disabled{opacity:.25}
.gin{width:100%;height:calc(var(--cell) * 1.3);border:0;border-bottom:2px solid var(--ink);background:transparent;font-size:28px;font-weight:700;text-align:right;padding:0 4px;color:var(--ink);outline:none;caret-color:var(--orange);border-radius:0;-webkit-user-select:text;user-select:text;margin-top:calc(var(--cell) * .6)}
.gin::placeholder{color:#B8B3AA;font-weight:700}
.og .tbig{grid-column:1/-1;grid-row:span 2;aspect-ratio:auto;height:calc(var(--cell) * 2);position:relative;display:flex;align-items:center;justify-content:center;background:#E6E3DD}
.tbig .tnum svg{height:calc(var(--cell) * .72);width:auto;display:block}
.tbig input{position:absolute;inset:0;opacity:0;width:100%;height:100%;font-size:16px}
.tbig.off{opacity:.25}
.din2{position:absolute;inset:0;opacity:0;width:100%;height:100%;font-size:16px}
.gdel{width:100%;height:var(--cell);color:#F00202;font-weight:700;font-size:15px;flex:none}
.og .pick{padding:0;border-radius:0;outline:none}
.og.pal{display:grid;max-width:none;gap:0;margin-bottom:0;justify-content:stretch}
.og.pal .gcol{width:auto;height:auto;border-radius:0;outline:none;aspect-ratio:1}
.og .t.w5,.og .t.w2{aspect-ratio:auto}
.gnote{font-size:13px;color:var(--muted);text-align:center;padding:10px 0;grid-column:1/-1}
#splash{position:fixed;inset:0;z-index:50;background:var(--paper);overflow:hidden}
#sgrid{position:absolute;left:0;top:0;direction:ltr;display:grid;transform-origin:0 0}
#sgrid>div{width:100%;aspect-ratio:1;transition:opacity .5s ease}
#sgrid>div svg{width:100%;height:100%;display:block}
#stitle{position:absolute;right:24px;top:calc(var(--st) + 120px);font-size:20px;font-weight:700}
#slogo{position:absolute;left:50%;top:50%;width:min(72vw,290px);transform:translate(-50%,-60%)}
#slogo .letters{width:100%;display:block}
#smark{position:absolute;top:0;right:0;width:25.3%;height:100%}
#smark svg{width:100%;height:100%;display:block}
#sslog{position:absolute;left:0;right:0;top:calc(50% + 34px);text-align:center;color:var(--orange);font-size:20px;font-weight:700;min-height:26px;direction:rtl}
#sslog .c{display:inline-block;width:2px;height:20px;background:var(--orange);vertical-align:-3px;margin-right:2px;animation:blink .6s steps(2) infinite}
@keyframes blink{50%{opacity:0}}
#toast{position:fixed;left:16px;right:16px;bottom:calc(var(--sb) + 16px);max-width:488px;margin:0 auto;background:var(--ink);color:var(--paper);border-radius:14px;padding:14px 16px;font-size:14px;line-height:1.45;z-index:15;display:none;align-items:flex-start;gap:12px}
#toast.on{display:flex}#toast button{color:var(--orange);font-weight:700;flex:none}
</style>
</head>
<body>
<div id="app">
 <header><div><div id="num"></div><p id="line"></p></div><button id="plus" aria-label="משימה חדשה"><i></i><i></i></button></header>
 <div id="stage"></div>
</div>
<div id="ov"><div class="ovin" id="ovin"></div></div>
<div id="toast"><span id="toastTxt"></span><button id="toastX">הבנתי</button></div>
<div id="splash"><div id="sgrid"></div><div id="stitle"></div><div id="slogo"></div><div id="sslog"></div></div>
<script>
/* failsafe: never let the splash block the app (Safari) */
(function(){function kill(){var s=document.getElementById('splash');if(s&&s.parentNode)s.parentNode.removeChild(s);}
window.__killSplash=kill;setTimeout(kill,6500);
var sp=document.getElementById('splash');if(sp){sp.style.cursor='pointer';sp.addEventListener('touchend',function(){setTimeout(kill,50)},{passive:true});sp.addEventListener('click',function(){setTimeout(kill,50)});}
function report(msg){kill();try{var b=document.getElementById('errbox');if(!b){b=document.createElement('div');b.id='errbox';b.style.cssText='position:fixed;left:12px;right:12px;bottom:12px;z-index:9999;background:#1C1A18;color:#F2F1EE;font:13px/1.4 -apple-system,Arial;padding:10px 12px;border-radius:12px;direction:ltr;text-align:left';document.body.appendChild(b);}b.textContent='FORM error: '+msg;}catch(e){}}
window.addEventListener('error',function(e){report((e.message||'')+' @'+(e.lineno||'')+':'+(e.colno||''));});
window.addEventListener('unhandledrejection',function(e){report('promise: '+(e.reason&&e.reason.message||e.reason));});})();
</script>

function occurrences(){const t0=todayISO();let lo=addDays(t0,-120),hi=addDays(t0,240);const out=[];

  if(t.repeat==='day'){let d=t.date<lo?lo:t.date;while(d<=hi){out.push({...t,date:d,key:t.id+'@'+d});d=addDays(d,1);}}

 else if(level===2){const ws=weekStart(d),we=addDays(ws,6);n.innerHTML=numSVG(parse(ws).getDate()+'–'+parse(we).getDate());l.textContent='שבוע '+weekNo(ws)+', '+MON(parse(we));}
 else{n.innerHTML=numSVG(p.getMonth()+1);l.textContent=MON(p)+' '+p.getFullYear();}}
function track(){if(!view||!tasks.length)return;const top=view.scrollTop;
 if(level===0){const pages=view.querySelectorAll('.page');const h=view.clientHeight;const i=Math.round(top/h);const p=pages[Math.min(i,pages.length-1)];if(p)current={date:p.dataset.date,id:p.dataset.id};}

  if(s){const k=s.dataset.key;let d=level===3?k+'-01':k;if(level===3&&monthKey(todayISO())===k)d=todayISO();if(level===2&&weekStart(todayISO())===k)d=todayISO();current={date:d,id:null};}}

function anchorEl(v,lv,anchor){if(!anchor)return null;const k=anchor.id?anchor.id+'@'+anchor.date:null;
 if(lv===0){let p=k&&v.querySelector(`.page[data-k="${k}"]`);if(!p){const vis=[...v.querySelectorAll('.page')].find(x=>x.offsetTop>=v.scrollTop-2);p=vis;}return p?p.querySelector('.big>div'):null;}
 let t=k&&v.querySelector(`.tile[data-k="${k}"]`);if(!t){const sec=[...v.querySelectorAll('.sec')].find(x=>x.offsetTop+x.offsetHeight>v.scrollTop+10);t=sec&&sec.querySelector('.tile');}return t;}
function centerOf(el,fallback){if(!el)return fallback;const r=el.getBoundingClientRect();return {x:r.left+r.width/2,y:r.top+r.height/2,w:r.width};}
let busy=false;
function show(lv,anchor,dir,fromScale){const old=view;const oldLv=level;const nv=render(lv);stage.appendChild(nv);level=lv;view=nv;
 current={date:anchor.date,id:anchor.id||null};scrollToAnchor(nv,lv,anchor);
 nv.addEventListener('scroll',()=>requestAnimationFrame(track),{passive:true});track();updateHeader();
 if(old&&dir){busy=true;const sr=stage.getBoundingClientRect();const mid={x:sr.left+sr.width/2,y:sr.top+sr.height/2,w:0};
  const ao=anchorEl(old,oldLv,anchor),an=anchorEl(nv,lv,anchor);let cO=centerOf(ao,mid),cN=centerOf(an,mid);
  let s=(ao&&an)?cN.w/cO.w:(dir>0?2.6:0.38);if(!isFinite(s)||s<=0)s=dir>0?2.6:0.38;
  const or=old.getBoundingClientRect(),nr=nv.getBoundingClientRect();
  const fs=fromScale||1;const curT=old.style.transform||'none';
  old.style.transformOrigin=`${cO.x-or.left}px ${cO.y-or.top}px`;nv.style.transformOrigin=`${cN.x-nr.left}px ${cN.y-nr.top}px`;
  const dx=cN.x-cO.x,dy=cN.y-cO.y;const D=560,E='cubic-bezier(.22,.9,.24,1)';
  old.style.pointerEvents='none';
  const oa=old.animate([{transform:`translate(0,0) scale(${fs})`,opacity:parseFloat(old.style.opacity||1)},{transform:`translate(${dx}px,${dy}px) scale(${s})`,opacity:0}],{duration:D,easing:E,fill:'forwards'});
  nv.animate([{transform:`translate(${-dx}px,${-dy}px) scale(${fs/s})`,opacity:0},{transform:`translate(${-dx*.15}px,${-dy*.15}px) scale(${(1+fs/s)/2>1?1.02:0.98})`,opacity:1,offset:.6},{transform:'none',opacity:1}],{duration:D,easing:E});
  const fin=()=>{if(old.isConnected)old.remove();busy=false;};oa.onfinish=fin;setTimeout(fin,D+150);}
 else if(old)old.remove();
 try{localStorage.setItem('form.level',lv)}catch(e){}}
function zoom(dir,anchor,fromScale){if(busy)return;const nl=level+(dir>0?-1:1);if(nl<0||nl>3||!tasks.length){if(view){view.animate([{transform:`scale(${fromScale||1})`},{transform:`scale(${dir>0?1.04:.96})`},{transform:'scale(1)'}],{duration:300,easing:'ease-out'});view.style.transform='';view.style.opacity='';}return;}show(nl,anchor||current,dir,fromScale);}
stage.addEventListener('click',e=>{if(pinch.moved)return;const ed=e.target.closest('[data-edit]');if(ed){openEdit(ed.dataset.edit);return;}
 if(e.target.closest('[data-add]')){openAdd();return;}
 const t=e.target.closest('.tile');if(t)zoom(1,{date:t.dataset.date,id:t.dataset.id});});

// pinch
const pinch={d0:0,r:1,moved:false,mid:null};
const dist=t=>Math.hypot(t[0].clientX-t[1].clientX,t[0].clientY-t[1].clientY);
stage.addEventListener('touchstart',e=>{if(e.touches.length===2){pinch.d0=dist(e.touches);pinch.r=1;pinch.moved=true;pinch.mid={x:(e.touches[0].clientX+e.touches[1].clientX)/2,y:(e.touches[0].clientY+e.touches[1].clientY)/2};
  if(view){const r=view.getBoundingClientRect();view.style.transformOrigin=`${pinch.mid.x-r.left}px ${pinch.mid.y-r.top}px`;}}},{passive:true});

  let anchor=current;const el=pinch.mid&&document.elementFromPoint(pinch.mid.x,pinch.mid.y);const a=el&&el.closest('[data-date]');if(a)anchor={date:a.dataset.date,id:a.dataset.id||null};
  else if(el){const s=el.closest('.sec');if(s){const k=s.dataset.key;anchor={date:level===3?k+'-01':k,id:null};}}
  const sc=Math.max(.6,Math.min(1.6,r));
  if(r>1.15)zoom(1,anchor,sc);else if(r<0.87)zoom(-1,anchor,sc);else if(view){view.animate([{transform:view.style.transform,opacity:view.style.opacity},{transform:'scale(1)',opacity:1}],{duration:220,easing:'ease-out'});view.style.transform='';view.style.opacity='';}

document.addEventListener('keydown',e=>{if($('#ov').classList.contains('on'))return;if(e.key==='+'||e.key==='=')zoom(1);if(e.key==='-'||e.key==='_')zoom(-1)});
// ---------- add / edit ----------
let draft=null,step=0,mode='add';const ovin=$('#ovin');const STEPS=5;
function openAdd(){mode='add';draft={title:'',shape:null,color:null,date:todayISO(),time:roundTime(),notime:false,repeat:'none'};step=0;$('#ov').classList.add('on');$('#toast').classList.remove('on');drawStep();}
function openEdit(id){const t=tasks.find(x=>x.id===id);if(!t)return;mode='edit';draft={...t,notime:!t.time,time:t.time||roundTime(),repeat:t.repeat||'none'};step=9;$('#ov').classList.add('on');drawStep();}
function closeOv(){$('#ov').classList.remove('on');ovin.innerHTML='';}
function roundTime(){const d=new Date();let m=Math.ceil(d.getMinutes()/30)*30,h=d.getHours();if(m===60){m=0;h=(h+1)%24}return pad(h)+':'+pad(m)}
function ovTop(){const prog='<div></div>';
 const back=(mode==='add'&&step>0)||(mode==='edit'&&step!==9)?'<button class="back" id="bk">חזרה</button>':'<span class="back"></span>';
 return `<div class="ovtop"><button class="x" id="cl" aria-label="סגירה"></button>${prog}${back}</div>`;}
const whenText=()=>`${draft.notime?'':draft.time+' · '}${rel(draft.date)||shortDay(draft.date)}`;
const repOpts=()=>{const d=parse(draft.date);return [['day','כל יום'],['week','כל שבוע · בימי '+WDAY(d).replace('יום ','')],['month','כל חודש · ב־'+d.getDate()+' לחודש'],['none','לא, רק הפעם']];};
function drawStep(){let h=ovTop();const col=draft.color||(draft.shape?SH[draft.shape].main:null);const nxt=mode==='edit'?'שמירה':'בחרתי';const INK='#1C1A18';
 if(step===0)h+=`<div class="step"><input class="gin" id="tin" maxlength="60" placeholder="מה המשימה?" value="${esc(draft.title)}" enterkeyhint="next" autocomplete="off"><button class="gcta" id="nx" style="margin-top:var(--cell)" ${draft.title.trim()?'':'disabled'}>${mode==='edit'?'שמירה':'המשך'}</button></div>`;
 if(step===1)h+=`<div class="step"><div class="scroll"><div class="og picks ${draft.shape?'has':''}">${SHAPES.map(s=>`<button class="c pick ${draft.shape===s.id?'sel':''}" data-s="${s.id}" aria-label="${s.name}">${svg(s.id,INK)}</button>`).join('')}</div></div><button class="gcta" id="nx" ${draft.shape?'':'disabled'}>${nxt}</button></div>`;
 if(step===2)h+=`<div class="step"><div class="og"><div class="c blk" id="prev">${svg(draft.shape,col)}</div></div><div class="og pal ${draft.color?'has':''}" style="margin-top:calc(var(--cell) * .5)">${PAL.map(([hx,n])=>`<button class="c gcol ${draft.color&&draft.color.toUpperCase()===hx?'sel':''}" style="background:${hx}" data-c="${hx}" aria-label="${n}"></button>`).join('')}</div><button class="gcta" id="nx" style="margin-top:auto">${nxt}</button></div>`;
 if(step===3){const t=todayISO(),tm=addDays(t,1);const which=draft.date===t?'t':draft.date===tm?'m':'o';
  h+=`<div class="step"><div class="og"><button class="c t w2 ${which==='t'?'on':''}" data-d="t">היום</button><button class="c t w2 ${which==='m'?'on':''}" data-d="m">מחר</button><label class="c t ${which==='o'?'on':''}" style="position:relative;font-size:13px;text-align:center;line-height:1.2">${which==='o'?shortDay(draft.date).replace('יום ',''):'תאריך'}<input type="date" class="din2" id="din" value="${draft.date}"></label>
  <label class="c tbig ${draft.notime?'off':''}"><span class="tnum">${numSVG(draft.time)}</span><input type="time" id="tim" value="${draft.time}" ${draft.notime?'disabled':''} aria-label="שעה"></label>
  <button class="c t w5 ${draft.notime?'on':''}" id="nt">כל היום</button></div><button class="gcta" id="nx" style="margin-top:auto">${mode==='edit'?'שמירה':'המשך'}</button></div>`;}
 if(step===4)h+=`<div class="step"><div class="og">${repOpts().map(([k,l])=>`<button class="c t w5 opt ${draft.repeat===k?'on':''}" data-r="${k}">${l}</button>`).join('')}</div><button class="gcta ${mode==='add'?'or':''}" id="nx" style="margin-top:auto">${mode==='add'?'הוספה':'שמירה'}</button></div>`;
 if(step===9)h+=`<div class="step"><input class="gin" id="tin" maxlength="60" value="${esc(draft.title)}" style="margin-top:0"><div class="og" style="margin-top:calc(var(--cell) * .4)"><button class="c t" data-go="1">צורה</button><button class="c t" data-go="2">צבע</button><button class="c t" data-go="3">זמן</button><button class="c t" data-go="4">חזרה</button><i class="c"></i></div><div class="og" style="margin-top:calc(var(--cell) * .5)"><div class="c blk">${svg(draft.shape,draft.color)}</div><div class="gnote">${whenText()}${repLabel(draft)}</div></div><button class="gcta" id="nx" style="margin-top:auto">שמירה</button><button class="gdel" id="del">מחיקה</button></div>`;
 ovin.innerHTML=h;wire();}
function wire(){$('#cl').onclick=closeOv;const bk=$('#bk');if(bk)bk.onclick=()=>{step=mode==='edit'?9:step-1;drawStep();};
 const tin=$('#tin');if(tin){tin.oninput=()=>{draft.title=tin.value;const n=$('#nx');if(n&&step===0)n.disabled=!tin.value.trim();};if(step===0)setTimeout(()=>{if(document.activeElement!==tin)tin.focus();},mode==='add'?2000:60);tin.onkeydown=e=>{if(e.key==='Enter'&&tin.value.trim()&&step===0)next();};}
 ovin.querySelectorAll('.pick').forEach(b=>b.onclick=()=>{draft.shape=b.dataset.s;if(mode==='add')draft.color=null;ovin.querySelectorAll('.pick').forEach(x=>x.classList.toggle('sel',x===b));ovin.querySelector('.picks').classList.add('has');$('#nx').disabled=false;});
 ovin.querySelectorAll('.pal button').forEach(b=>b.onclick=()=>{draft.color=b.dataset.c;$('#prev').innerHTML=svg(draft.shape,draft.color);ovin.querySelectorAll('.pal button').forEach(x=>x.classList.toggle('sel',x===b));ovin.querySelector('.pal').classList.add('has');});
 ovin.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>{const t=todayISO();draft.date=b.dataset.d==='t'?t:b.dataset.d==='m'?addDays(t,1):(draft.date===t||draft.date===addDays(t,1)?addDays(t,2):draft.date);drawStep();});
 const din=$('#din');if(din)din.onchange=()=>{if(din.value)draft.date=din.value;};
 const tim=$('#tim');if(tim)tim.oninput=tim.onchange=()=>{if(tim.value){draft.time=tim.value;ovin.querySelector('.tnum').innerHTML=numSVG(draft.time);}};if(din)din.onchange=()=>{if(din.value){draft.date=din.value;drawStep();}};
 const nt=$('#nt');if(nt)nt.onclick=()=>{draft.notime=!draft.notime;drawStep();};
 ovin.querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>{draft.repeat=b.dataset.r;ovin.querySelectorAll('[data-r]').forEach(x=>x.classList.toggle('on',x===b));});

 const del=$('#del');if(del)del.onclick=()=>{if(del.dataset.sure){tasks=tasks.filter(t=>t.id!==draft.id);save();closeOv();show(tasks.length?level:1,{date:draft.date},0);}else{del.dataset.sure=1;del.textContent=draft.repeat&&draft.repeat!=='none'?'זו משימה חוזרת. לחצי שוב כדי למחוק את כולה':'בטוחה? לחצי שוב למחיקה';}};

function next(){if(mode==='edit'){if(step===9){commit();return;}step=9;drawStep();return;}

function commit(){const t={id:draft.id||uid(),title:draft.title.trim()||'משימה',shape:draft.shape,color:draft.color||SH[draft.shape].main,date:draft.date,time:draft.notime?null:draft.time,repeat:draft.repeat||'none',created:draft.created||Date.now()};
 const i=tasks.findIndex(x=>x.id===t.id);if(i>=0)tasks[i]=t;else tasks.push(t);save();const wasAdd=mode==='add';closeOv();
 show(0,{date:t.date,id:t.id},0);const el=view.querySelector(`.page[data-id="${t.id}"][data-date="${t.date}"] .big>div`);
 if(el&&wasAdd)el.animate([{transform:'translateY(-40px) scale(.6)',opacity:0},{transform:'translateY(6px) scale(1.03)',opacity:1,offset:.7},{transform:'none',opacity:1}],{duration:620,easing:'cubic-bezier(.2,.8,.2,1)'});}
// ---------- splash: one task → zoom out to many → logo ----------
function splash(){const sp=$('#splash'),g=$('#sgrid');const vw=innerWidth,vh=innerHeight;
 const T=30,P=30,C=Math.ceil(vw/P)+3,R=Math.ceil(vh/P)+3,AC=Math.floor(C/2),AR=Math.floor(R/2);
 let seed=11;const r=()=>{seed=(seed*16807)%2147483647;return (seed-1)/2147483646};
 const HMARK=`<svg viewBox="0 0 105 111"><rect x="2" y="1.5" width="101" height="32.75" fill="#1C1A18"/><rect x="2" y="38.5" width="101" height="33.75" fill="#FA4416"/><rect x="2" y="75.75" width="101" height="33.5" fill="#1C1A18"/></svg>`;
 let html='';for(let y=0;y<R;y++)for(let x=0;x<C;x++){if(x===AC&&y===AR){html+=`<div class="a">${HMARK}</div>`;continue;}const s=SHAPES[Math.floor(r()*SHAPES.length)];const c=r()<.5?s.main:PAL[Math.floor(r()*PAL.length)][0];html+=`<div>${svg(s.id,c)}</div>`;}
 const K=Math.min(vw*0.62,vh*0.32)/T;g.style.gridTemplateColumns=`repeat(${C},${T*K}px)`;g.style.gap=(P-T)*K+'px';g.innerHTML=html;
 const ox=(vw-(C*P-(P-T)))/2,oy=(vh-(R*P-(P-T)))/2;const ax=AC*P+T/2,ay=AR*P+T/2;
 const tfFull=`translate(${ox}px,${oy}px) scale(${1/K})`;const tf=s=>`translate(${vw/2-ax*s}px,${vh/2-ay*s}px) scale(${s/K})`;
 g.style.transform=tfFull;$('#stitle').textContent='';
 const lg=$('#slogo');lg.innerHTML=LETTERS+`<div id="smark">${MARK}</div>`;lg.style.opacity=0;const sl=$('#sslog');
 let done=false;const end=()=>{if(done)return;done=true;sp.style.pointerEvents='none';sp.style.transition='opacity .35s';sp.style.opacity='0';setTimeout(()=>sp.remove(),450);};sp.addEventListener('click',end);
 const Z=2300;g.animate([{transform:tfFull},{transform:tf(K)}],{duration:Z,delay:250,easing:'cubic-bezier(.7,0,.25,1)',fill:'forwards'});
 const others=[...g.children].filter(d=>!d.classList.contains('a'));
 setTimeout(()=>others.forEach(d=>{d.style.transition='opacity .7s ease';d.style.opacity=0;}),250+Z*0.62);
 setTimeout(()=>{const a=g.querySelector('.a');const ar=a.getBoundingClientRect();
  lg.style.opacity=1;const L=[...lg.querySelectorAll('.L')];L.forEach(n=>n.style.opacity=0);
  const m=$('#smark');const mr=m.getBoundingClientRect();const sc=ar.height/mr.width;const dx=(ar.left+ar.width/2)-(mr.left+mr.width/2),dy=(ar.top+ar.height/2)-(mr.top+mr.height/2);
  g.style.transition='opacity .25s';g.style.opacity=0;
  const MD=1100;m.animate([{transform:`translate(${dx}px,${dy}px) rotate(90deg) scale(${sc})`},{transform:'none'}],{duration:MD,easing:'cubic-bezier(.65,0,.3,1)',fill:'forwards'});
  L.forEach((n,i)=>n.animate([{opacity:0,transform:'translateX(70px)'},{opacity:1,transform:'none'}],{duration:620,delay:MD*0.45+(2-i)*90,easing:'cubic-bezier(.2,.8,.2,1)',fill:'forwards'}));
 },250+Z);
 const text='תני צורה ליום שלך';setTimeout(()=>{let i=0;const iv=setInterval(()=>{i++;sl.innerHTML=esc(text.slice(0,i))+'<span class="c"></span>';if(i>=text.length)clearInterval(iv);},55);},3700);
 setTimeout(end,5600);}
// ---------- install hint ----------
function hint(){const standalone=matchMedia('(display-mode: standalone)').matches||navigator.standalone;let seen=false;try{seen=localStorage.getItem('form.hint')}catch(e){}

 $('#toastTxt').textContent=ios?'כדי שזו תהיה אפליקציה בטלפון: לחצי על כפתור השיתוף בספארי ואז "הוספה למסך הבית".':'כדי להתקין: בתפריט הדפדפן בחרי "התקנת אפליקציה" או "הוספה למסך הבית".';
 setTimeout(()=>{if(!$('#ov').classList.contains('on'))$('#toast').classList.add('on')},5600);$('#toastX').onclick=()=>{$('#toast').classList.remove('on');try{localStorage.setItem('form.hint','1')}catch(e){}};}

try{hint();}catch(e){}
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});
